---
- hosts: all
  become: yes
  tasks:
    - name: Install mdadm
      apt:
        name: mdadm
        state: present
        update_cache: yes

    - name: Create RAID 10 array
      community.general.raid:
        level: 10
        devices:
          - /dev/sdb
          - /dev/sdc
          - /dev/sdd
          - /dev/sde
        raid_device: /dev/md0
        state: present

    - name: Create a filesystem on the RAID device
      filesystem:
        fstype: ext4
        dev: /dev/md0

    - name: Create mount point
      file:
        path: /mnt/raid10
        state: directory
        mode: '0755'

    - name: Mount the RAID device
      mount:
        path: /mnt/raid10
        src: /dev/md0
        fstype: ext4
        state: mounted

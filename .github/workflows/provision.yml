name: Provision RAID Workstation

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply Terraform (true) or just plan (false)'
        type: boolean
        default: false
      migrate_root:
        description: 'Set migrate_root=true for root FS migration'
        type: boolean
        default: false
      enable_gpu_monitoring:
        description: 'Enable GPU monitoring role'
        type: boolean
        default: true

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TF_IN_AUTOMATION: 1
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install terraform-exec

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply (conditional)
        if: inputs.apply == true
        run: terraform apply -auto-approve tfplan

      - name: Capture server IP
        id: tfout
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "server_ip=$(terraform output -raw server_ip)" >> $GITHUB_OUTPUT
          else
            # If not applying, attempt to read existing state output (may fail)
            set +e
            ip=$(terraform output -raw server_ip 2>/dev/null)
            set -e
            if [ -n "$ip" ]; then
              echo "server_ip=$ip" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Fail if no server IP available for provisioning
        if: inputs.apply == true && steps.tfout.outputs.server_ip == ''
        run: |
          echo 'No server_ip output. Ensure terraform apply succeeded.'
          exit 1

      - name: Generate dynamic inventory
        if: steps.tfout.outputs.server_ip != ''
        run: |
          echo "[raid_server]" > inventory.generated.ini
          echo "${{ steps.tfout.outputs.server_ip }} ansible_user=root" >> inventory.generated.ini
          cat inventory.generated.ini

      - name: Wait for SSH to become available
        if: steps.tfout.outputs.server_ip != ''
        run: |
          for i in {1..30}; do
            if timeout 5 bash -c "</dev/tcp/${{ steps.tfout.outputs.server_ip }}/22"; then
              echo 'SSH up'; break; fi
            echo 'Waiting for SSH...'; sleep 10;
          done

      - name: Ansible Provision
        if: steps.tfout.outputs.server_ip != ''
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        run: |
          EXTRA_VARS="migrate_root=${{ inputs.migrate_root }} enable_gpu_monitoring=${{ inputs.enable_gpu_monitoring }}"
          ansible-playbook -i inventory.generated.ini ubuntu-cinnamon/workstation.yml -e "$EXTRA_VARS" -vv

      - name: Upload provisioning logs
        if: always() && steps.tfout.outputs.server_ip != ''
        uses: actions/upload-artifact@v4
        with:
          name: ansible-logs
          path: ./*.log
          if-no-files-found: ignore

      - name: Terraform Destroy (manual follow-up)
        if: always() && inputs.apply == true
        run: |
          echo 'NOTE: Automatic destroy not executed. Run manually if needed.'

---
driver:
  name: delegated

platforms:
  - name: target
    host: ${TARGET_HOST}
    user: ${TARGET_USER:-root}
    ssh_identity_file: ${SSH_KEY:-~/.ssh/id_rsa}
    groups:
      - gpu_monitoring_test

provisioner:
  name: ansible
  inventory:
    hosts:
      all:
        hosts:
          target:
            ansible_host: ${TARGET_HOST}
            ansible_user: ${TARGET_USER:-root}
            ansible_ssh_private_key_file: ${SSH_KEY:-~/.ssh/id_rsa}
  playbooks:
    converge: converge.yml
  lint: |
    ansible-lint

verifier:
  name: testinfra
  directory: tests
  options:
    verbose: true

scenario:
  name: delegated
  test_sequence:
    - converge
    - idempotence
    - verify

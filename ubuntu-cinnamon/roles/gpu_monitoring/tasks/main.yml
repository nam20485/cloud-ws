---
- name: Create monitoring user
  user:
    name: nodeexp
    system: true
    shell: /usr/sbin/nologin

- name: Download node_exporter tarball
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/node_exporter.tar.gz
    mode: '0644'

- name: Extract node_exporter
  unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /opt
    remote_src: true
    creates: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Symlink node_exporter
  file:
    src: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    state: link

- name: Create textfile collector dir
  file:
    path: /var/lib/node_exporter
    state: directory
    owner: nodeexp
    group: nodeexp
    mode: '0755'

- name: GPU metrics script
  copy:
    dest: /usr/local/bin/gpu_metrics.sh
    mode: '0755'
    content: |
      #!/usr/bin/env bash
      OUT=/var/lib/node_exporter/gpu.prom
      if ! command -v nvidia-smi >/dev/null 2>&1; then
        exit 0
      fi
      NOW=$(date +%s)
      nvidia-smi --query-gpu=index,utilization.gpu,utilization.memory,memory.total,memory.used,temperature.gpu,power.draw --format=csv,noheader,nounits | \
      awk -v ts=$NOW 'BEGIN{print "# HELP gpu_utilization_percent GPU core utilization"; print "# TYPE gpu_utilization_percent gauge"} {
        printf("gpu_utilization_percent{gpu=\"%s\"} %s\n", $1, $2);
        printf("gpu_mem_utilization_percent{gpu=\"%s\"} %s\n", $1, $3);
        printf("gpu_memory_total_megabytes{gpu=\"%s\"} %s\n", $1, $4);
        printf("gpu_memory_used_megabytes{gpu=\"%s\"} %s\n", $1, $5);
        printf("gpu_temperature_celsius{gpu=\"%s\"} %s\n", $1, $6);
        printf("gpu_power_draw_watts{gpu=\"%s\"} %s\n", $1, $7);
      }' > $OUT.$$ && mv $OUT.$$ $OUT

- name: Systemd unit for node_exporter
  copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=nodeexp
      Group=nodeexp
      ExecStart=/usr/local/bin/node_exporter --collector.textfile.directory=/var/lib/node_exporter
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target

- name: GPU metrics timer unit
  copy:
    dest: /etc/systemd/system/gpu-metrics.service
    mode: '0644'
    content: |
      [Unit]
      Description=Collect GPU metrics for Prometheus

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/gpu_metrics.sh

- name: GPU metrics timer
  copy:
    dest: /etc/systemd/system/gpu-metrics.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Run GPU metrics script periodically

      [Timer]
      OnBootSec=1m
      OnUnitActiveSec={{ gpu_metrics_interval_sec }}s

      [Install]
      WantedBy=timers.target

- name: Enable and start services
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - node_exporter.service
    - gpu-metrics.timer
